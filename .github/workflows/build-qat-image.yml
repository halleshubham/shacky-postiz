name: "Build QAT Image"

# Manual, on-demand counterpart to build-containers.yml (which only builds on
# tag push, and pushes to the upstream gitroomhq/postiz-app image): lets any
# branch be built and pushed to this fork's own ghcr.io/halleshubham/postiz-app
# image under an explicit tag, for deploying a test build to social-qat.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish under ghcr.io/halleshubham/postiz-app"
        required: false
  # GitHub only lets workflow_dispatch target a workflow already present on the
  # default branch, so until this file merges to main a push trigger scoped to
  # this exact branch is what actually fires the build.
  push:
    branches:
      - claude/eager-clarke-0jfrth

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=qat-test-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        env:
          NEXT_PUBLIC_VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ghcr.io/halleshubham/postiz-app:${{ steps.vars.outputs.tag }} \
            --build-arg NEXT_PUBLIC_VERSION=${{ env.NEXT_PUBLIC_VERSION }} \
            --push .
